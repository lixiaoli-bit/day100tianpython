<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>阿少学长de技术文档</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="Description">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <!-- 设置浏览器图标 -->
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="favicon.svg" type="image/x-icon">

    <!-- 默认主题 -->
    <link rel="stylesheet" href="./themes/vue.css">

    <!-- 其他主题（可选） -->
    <!-- <link rel="stylesheet" href="./themes/buble.css"> -->
    <!-- <link rel="stylesheet" href="./themes/dark.css"> -->
    <!-- <link rel="stylesheet" href="./themes/dolphin.css"> -->
    <!-- <link rel="stylesheet" href="./themes/pure.css"> -->
    <!-- 👇 你的自定义 CSS 写在这里 -->
  <style>
    .app-nav a {
  background-color: #42b983 !important;
  padding: 6px 20px !important;
  border-radius: 20px !important;
  color: #fff !important;
  display: inline-block !important;
}

/* 把导航容器背景清掉 */
.app-nav {
  background: none !important;
}
    }
  </style>
  <!-- 👆 到这里 -->
</head>

<body>
    <!-- 定义加载时候的动作 -->
    <div id="app">正在加载中...</div>
    <script>
        // 1. 启动前强制清空 Docsify 内存缓存（防止内存作祟）
        if (window.$docsify && window.$docsify.cache) {
            window.$docsify.cache = {};
        }
        
        window.$docsify = {
            // 项目名称
            name: '<strong>《100天精通python》</strong>',
            // 仓库地址，点击右上角的Github章鱼猫头像会跳转到此地址
            repo: 'http://16.16.210.45:8080',
            // 侧边栏支持，默认加载的是项目根目录下的_sidebar.md文件
            loadSidebar: true,
            // 导航栏支持，默认加载的是项目根目录下的_navbar.md文件
            loadNavbar: true,
            // 封面支持，默认加载的是项目根目录下的_coverpage.md文件
            coverpage: true,
            // 最大支持渲染的标题层级
            maxLevel: 5,
            // 自定义侧边栏后默认不会再生成目录，设置生成目录的最大层级（建议配置为2-4）
            subMaxLevel: 4,
            // 小屏设备下合并导航栏到侧边栏
            mergeNavbar: true,
            // 侧边栏默认展开的层级（0=全部折叠，1=展开一级，2=展开二级，以此类推）
            sidebarDisplayLevel: 1,
            baiduTjId: "c5f1451ab2a384a8e5ebe2af80c62f3",  // 百度统计
            
            /**
             * 核心改动：beforeEach 钩子
             * 功能：拦截所有 .md 文件的请求，自动加上随机时间戳 (?t=xxxxxxxxxx)
             * 效果：任何人访问，无论是否开无痕，永远拉取最新文件，彻底绕过浏览器缓存
             */
            beforeEach: function(route, next) {
                // 检测请求路径是否包含 .md，并且为了避免重复加参数，检查是否已有 '?t='
                if (route.path && route.path.includes('.md') && !route.path.includes('?t=')) {
                    // 拼接时间戳，确保每次都不同
                    route.path = route.path + '?t=' + Date.now();
                }
                // 必须调用 next() 让路由继续
                next();
            },

            /*搜索相关设置*/
            search: {
                maxAge: 0, // 过期时间设为0，搜索索引也不缓存
                paths: 'auto',
                placeholder: {
                    '/zh-cn/': '搜索',
                    '/': '🔍点击这里搜索'
                },
                noData: '找不到结果',
                depth: 4,
                hideOtherSidebarContent: false,
                namespace: '阿少学长de技术文档',
            }
        }
    </script>
    <!-- docsify的js依赖 -->
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
    <!-- emoji表情支持 -->
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
    <!-- 图片放大缩小支持 -->
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
    <!-- 搜索功能支持 -->
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <!--在所有的代码块上添加一个简单的Click to copy按钮-->
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
    <!-- 侧边栏折叠 -->
    <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
    <!-- 百度统计 -->
    <script src="https://unpkg.com/docsify-baidu-tj@1.0.2/dist/docsify-baidu-tj.min.js"></script>
</body>

</html>
